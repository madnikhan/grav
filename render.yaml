services:
  - type: web
    name: silbele-cosmetics
    env: php
    buildCommand: composer install --no-dev --optimize-autoloader
    startCommand: php -S 0.0.0.0:$PORT system/router.php
    envVars:
      - key: PHP_VERSION
        value: 8.1
      - key: GRAV_ENVIRONMENT
        value: production
    healthCheckPath: /
    autoDeploy: true 